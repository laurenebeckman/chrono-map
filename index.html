<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="ChronoMap — interactive global historical map overlays. Compare past and present with OpenHistoricalMap." />
  <meta name="theme-color" content="#1a1a2e" />
  <title>ChronoMap — Historical Map Overlays</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- OpenHistoricalMap date filter plugin -->
  <script src="https://unpkg.com/@openhistoricalmap/maplibre-gl-dates@1.3.0/dist/maplibre-gl-dates.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f1a; color: #e8e8f0; }
    #map { position: absolute; inset: 0; }

    /* Control panel */
    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(15, 15, 26, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 16px;
      width: min(320px, calc(100vw - 24px));
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    #controls h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
      color: #fff;
    }
    #controls .subtitle {
      font-size: 0.75rem;
      color: #a0a0b8;
      margin-bottom: 14px;
    }

    .year-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    #year-display {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 72px;
      color: #7dd3fc;
    }
    #year-slider {
      flex: 1;
      accent-color: #38bdf8;
      height: 6px;
    }
    #year-input {
      width: 78px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    #year-input:focus { outline: 2px solid #38bdf8; border-color: transparent; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      color: #e8e8f0;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(255,255,255,0.14); }
    button.active {
      background: #0ea5e9;
      border-color: #0ea5e9;
      color: #fff;
    }

    .note {
      margin-top: 12px;
      font-size: 0.7rem;
      line-height: 1.4;
      color: #8888a0;
    }
    .note a { color: #7dd3fc; text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    /* Attribution override */
    .maplibregl-ctrl-attrib {
      background: rgba(15,15,26,0.8) !important;
      color: #aaa !important;
      font-size: 10px !important;
    }
    .maplibregl-ctrl-attrib a { color: #7dd3fc !important; }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      #controls { top: 8px; left: 8px; padding: 12px; }
      #year-display { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <h1>ChronoMap</h1>
    <div class="subtitle">Past ↔ Present · Global historical overlays</div>

    <div class="year-row">
      <span id="year-display">1900</span>
      <input type="range" id="year-slider" min="1000" max="2020" value="1900" step="1" />
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <label for="year-input" style="font-size:0.75rem; color:#a0a0b8;">Year</label>
      <input type="number" id="year-input" min="1" max="2025" value="1900" />
    </div>

    <div class="btn-row">
      <button id="btn-historical" class="active">Historical (OHM)</button>
      <button id="btn-modern">Modern</button>
    </div>

    <div class="note">
      Data: <a href="https://www.openhistoricalmap.org/" target="_blank" rel="noopener">OpenHistoricalMap</a> ·
      Filter by year to avoid anachronisms. Coverage & detail vary by region and era.
      Share the URL to keep place + year.
    </div>
  </div>

  <script>
    // ---------- Config ----------
    const OHM_STYLE = 'https://unpkg.com/@openhistoricalmap/map-styles@latest/dist/historical/historical.json';
    // Fallback / alternative official style
    // const OHM_STYLE = 'https://www.openhistoricalmap.org/map-styles/main/main.json';

    const MODERN_STYLE = 'https://tiles.openfreemap.org/styles/liberty'; // free, no key

    let currentYear = 1900;
    let isHistorical = true;

    // ---------- Map ----------
    const map = new maplibregl.Map({
      container: 'map',
      style: OHM_STYLE,
      center: [10, 50],          // roughly central Europe as a nice starting point
      zoom: 4,
      hash: true,               // enables #map=z/lat/lon
      attributionControl: {
        compact: true,
        customAttribution: '<a href="https://www.openhistoricalmap.org/">OpenHistoricalMap</a> · ChronoMap'
      }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 120 }), 'bottom-left');

    // ---------- Date filtering ----------
    function applyDateFilter(year) {
      currentYear = year;
      document.getElementById('year-display').textContent = year;
      document.getElementById('year-slider').value = year;
      document.getElementById('year-input').value = year;

      // Prefer the official plugin if available
      if (typeof map.filterByDate === 'function') {
        try {
          map.filterByDate(String(year));
        } catch (e) {
          console.warn('filterByDate failed', e);
        }
      } else {
        // Manual fallback (basic) – the plugin is preferred
        console.info('maplibre-gl-dates plugin not detected; date filter may be limited');
      }

      // Keep date in the URL hash for sharing (alongside MapLibre's own hash)
      updateHashDate(year);
    }

    function updateHashDate(year) {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      // MapLibre hash is usually map=z/lat/lon — we append &date=YYYY
      // Simple approach: rewrite the hash while preserving map= if present
      let hash = location.hash || '';
      if (hash.includes('date=')) {
        hash = hash.replace(/date=[^&]*/, 'date=' + year);
      } else {
        hash = hash ? (hash + '&date=' + year) : ('#date=' + year);
      }
      // Avoid infinite loops; only replace if different
      if (location.hash !== hash) {
        history.replaceState(null, '', hash);
      }
    }

    // Apply initial filter once style is ready
    map.once('styledata', () => {
      // Read date from URL if present
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const urlDate = params.get('date');
      if (urlDate && !isNaN(parseInt(urlDate, 10))) {
        currentYear = parseInt(urlDate, 10);
      }
      applyDateFilter(currentYear);
    });

    // Re-apply after style changes (e.g. switching modern ↔ historical)
    map.on('styledata', () => {
      if (isHistorical && typeof map.filterByDate === 'function') {
        try { map.filterByDate(String(currentYear)); } catch (e) {}
      }
    });

    // ---------- UI wiring ----------
    const slider = document.getElementById('year-slider');
    const input = document.getElementById('year-input');

    slider.addEventListener('input', (e) => {
      applyDateFilter(parseInt(e.target.value, 10));
    });

    input.addEventListener('change', (e) => {
      let y = parseInt(e.target.value, 10);
      if (isNaN(y)) y = currentYear;
      y = Math.max(1, Math.min(2025, y));
      applyDateFilter(y);
    });

    // Style toggle
    document.getElementById('btn-historical').addEventListener('click', () => {
      if (isHistorical) return;
      isHistorical = true;
      document.getElementById('btn-historical').classList.add('active');
      document.getElementById('btn-modern').classList.remove('active');
      map.setStyle(OHM_STYLE);
      // filter will be re-applied on styledata
    });

    document.getElementById('btn-modern').addEventListener('click', () => {
      if (!isHistorical) return;
      isHistorical = false;
      document.getElementById('btn-modern').classList.add('active');
      document.getElementById('btn-historical').classList.remove('active');
      map.setStyle(MODERN_STYLE);
    });

    // Keyboard: arrow keys change year
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        applyDateFilter(Math.max(1, currentYear - (e.shiftKey ? 10 : 1)));
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        applyDateFilter(Math.min(2025, currentYear + (e.shiftKey ? 10 : 1)));
      }
    });
  </script>
</body>
</html>
