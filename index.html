<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="ChronoMap — interactive global historical map overlays. Compare past and present with OpenHistoricalMap." />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ChronoMap — Historical Map Overlays</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- Date filter plugin (may load as UMD; we also have a soft fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/@openhistoricalmap/maplibre-gl-dates@1.3.0/dist/maplibre-gl-dates.js"></script>
  <script src="https://unpkg.com/@openhistoricalmap/maplibre-gl-dates@1.3.0"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f1a; color: #e8e8f0; }
    #map { position: absolute; inset: 0; }

    #controls {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 15, 26, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px 16px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #controls h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
    .subtitle { font-size: 0.72rem; color: #a0a0b8; margin: 2px 0 12px; }

    .search-row { display: flex; gap: 6px; margin-bottom: 12px; }
    #search-input {
      flex: 1; padding: 8px 10px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: #fff; font-size: 0.85rem;
    }
    #search-input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    #search-btn, #geo-btn {
      padding: 8px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08); color: #e8e8f0; cursor: pointer; font-size: 0.85rem;
    }
    #search-btn:hover, #geo-btn:hover { background: rgba(255,255,255,0.16); }

    .year-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #year-display {
      font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums;
      min-width: 68px; color: #7dd3fc;
    }
    #year-slider { flex: 1; accent-color: #38bdf8; height: 6px; }
    #year-input {
      width: 72px; padding: 5px 6px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: #fff;
      font-size: 0.9rem; font-variant-numeric: tabular-nums; text-align: center;
    }

    .presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 10px; }
    .presets button {
      padding: 5px 8px; font-size: 0.72rem; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #c0c0d0; cursor: pointer;
    }
    .presets button:hover { background: rgba(56,189,248,0.2); color: #fff; }
    .presets button.active-preset { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

    .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row button {
      flex: 1; min-width: 0; padding: 8px 8px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07); color: #e8e8f0;
      font-size: 0.78rem; font-weight: 500; cursor: pointer;
    }
    .btn-row button:hover { background: rgba(255,255,255,0.14); }
    .btn-row button.active { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }

    .section-label { font-size: 0.7rem; color: #8888a0; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    #notes {
      width: 100%; min-height: 70px; padding: 8px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: #e0e0f0;
      font-size: 0.8rem; resize: vertical; font-family: inherit;
    }
    #notes:focus { outline: 2px solid #38bdf8; }

    .note {
      margin-top: 10px; font-size: 0.68rem; line-height: 1.4; color: #8888a0;
    }
    .note a { color: #7dd3fc; text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    .maplibregl-ctrl-attrib { background: rgba(15,15,26,0.85) !important; color: #aaa !important; font-size: 10px !important; }
    .maplibregl-ctrl-attrib a { color: #7dd3fc !important; }

    #status {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(15,15,26,0.9); padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; color: #a0e0ff; z-index: 5; display: none;
      border: 1px solid rgba(56,189,248,0.3);
    }

    @media (max-width: 480px) {
      #controls { top: 8px; left: 8px; padding: 12px; width: calc(100vw - 16px); }
      #year-display { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>

  <div id="controls">
    <h1>ChronoMap</h1>
    <div class="subtitle">Past ↔ Present · Global historical overlays</div>

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search place…" autocomplete="off" />
      <button id="search-btn" title="Search">🔍</button>
      <button id="geo-btn" title="My location">📍</button>
    </div>

    <div class="year-row">
      <span id="year-display">1900</span>
      <input type="range" id="year-slider" min="1000" max="2024" value="1900" step="1" />
    </div>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:4px;">
      <label for="year-input" style="font-size:0.72rem; color:#a0a0b8;">Year</label>
      <input type="number" id="year-input" min="1" max="2025" value="1900" />
    </div>

    <div class="presets" id="presets">
      <button data-year="1500">1500</button>
      <button data-year="1700">1700</button>
      <button data-year="1800">1800</button>
      <button data-year="1850">1850</button>
      <button data-year="1900" class="active-preset">1900</button>
      <button data-year="1950">1950</button>
      <button data-year="2000">2000</button>
      <button data-year="2020">2020</button>
    </div>

    <div class="btn-row">
      <button id="btn-historical" class="active">Historical</button>
      <button id="btn-modern">Modern</button>
      <button id="btn-compare" title="Scaffold for future swipe/opacity mode">Compare</button>
    </div>

    <div class="section-label">Research notes</div>
    <textarea id="notes" placeholder="Notes for this place & year… (saved locally)"></textarea>

    <div class="note">
      Data © <a href="https://www.openhistoricalmap.org/" target="_blank" rel="noopener">OpenHistoricalMap</a> contributors.
      Year filter reduces anachronisms. Coverage varies by region & era.
      URL keeps place + year. Notes stay in this browser.
    </div>
  </div>

  <script>
    const OHM_STYLE = 'https://unpkg.com/@openhistoricalmap/map-styles@latest/dist/historical/historical.json';
    const MODERN_STYLE = 'https://tiles.openfreemap.org/styles/liberty';

    let currentYear = 1900;
    let isHistorical = true;
    let compareMode = false;

    const map = new maplibregl.Map({
      container: 'map',
      style: OHM_STYLE,
      center: [10, 50],
      zoom: 4,
      hash: true,
      attributionControl: {
        compact: true,
        customAttribution: '<a href="https://www.openhistoricalmap.org/">OpenHistoricalMap</a> · ChronoMap'
      }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }), 'bottom-left');

    function showStatus(msg, ms = 2200) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
    }

    function applyDateFilter(year) {
      currentYear = Math.max(1, Math.min(2025, year | 0));
      document.getElementById('year-display').textContent = currentYear;
      document.getElementById('year-slider').value = currentYear;
      document.getElementById('year-input').value = currentYear;

      // Highlight matching preset
      document.querySelectorAll('.presets button').forEach(b => {
        b.classList.toggle('active-preset', parseInt(b.dataset.year, 10) === currentYear);
      });

      if (typeof map.filterByDate === 'function') {
        try { map.filterByDate(String(currentYear)); }
        catch (e) { console.warn('filterByDate', e); }
      } else {
        // Soft fallback message once
        if (!window._filterWarned) {
          console.info('Date plugin not fully loaded; year UI still works for sharing/notes.');
          window._filterWarned = true;
        }
      }

      updateHashDate(currentYear);
      loadNotes();
    }

    function updateHashDate(year) {
      let hash = location.hash || '';
      if (hash.includes('date=')) {
        hash = hash.replace(/date=[^&]*/, 'date=' + year);
      } else {
        hash = hash ? (hash + (hash.includes('?') || hash.includes('=') ? '&' : '') + 'date=' + year) : ('#date=' + year);
      }
      // Cleaner: prefer &date= after map=
      if (location.hash !== hash) history.replaceState(null, '', hash);
    }

    map.once('styledata', () => {
      const params = new URLSearchParams(location.hash.replace(/^#/, '').replace(/&/g, '&'));
      // also parse from full hash string
      const m = location.hash.match(/date=(\d+)/);
      if (m) currentYear = parseInt(m[1], 10);
      applyDateFilter(currentYear);
    });

    map.on('styledata', () => {
      if (isHistorical && typeof map.filterByDate === 'function') {
        try { map.filterByDate(String(currentYear)); } catch (e) {}
      }
    });

    // UI
    document.getElementById('year-slider').addEventListener('input', e => {
      applyDateFilter(parseInt(e.target.value, 10));
    });
    document.getElementById('year-input').addEventListener('change', e => {
      applyDateFilter(parseInt(e.target.value, 10) || currentYear);
    });

    document.querySelectorAll('.presets button').forEach(btn => {
      btn.addEventListener('click', () => applyDateFilter(parseInt(btn.dataset.year, 10)));
    });

    document.getElementById('btn-historical').addEventListener('click', () => {
      if (isHistorical) return;
      isHistorical = true;
      document.getElementById('btn-historical').classList.add('active');
      document.getElementById('btn-modern').classList.remove('active');
      map.setStyle(OHM_STYLE);
      showStatus('Historical layer');
    });

    document.getElementById('btn-modern').addEventListener('click', () => {
      if (!isHistorical) return;
      isHistorical = false;
      document.getElementById('btn-modern').classList.add('active');
      document.getElementById('btn-historical').classList.remove('active');
      map.setStyle(MODERN_STYLE);
      showStatus('Modern basemap');
    });

    // Compare scaffolding
    document.getElementById('btn-compare').addEventListener('click', () => {
      compareMode = !compareMode;
      document.getElementById('btn-compare').classList.toggle('active', compareMode);
      showStatus(compareMode
        ? 'Compare mode (scaffolding) — full swipe/opacity coming next'
        : 'Compare mode off');
      // Future: split view or opacity slider between two styles
    });

    // Geolocation
    document.getElementById('geo-btn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showStatus('Geolocation not supported');
        return;
      }
      showStatus('Locating…');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 12 });
          showStatus('Centered on your location');
        },
        () => showStatus('Location permission denied or unavailable')
      );
    });

    // Search (Nominatim)
    async function doSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      showStatus('Searching…');
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        const data = await res.json();
        if (data && data[0]) {
          const { lon, lat, display_name } = data[0];
          map.flyTo({ center: [parseFloat(lon), parseFloat(lat)], zoom: 11 });
          showStatus(display_name.split(',').slice(0, 2).join(', '));
        } else {
          showStatus('No results');
        }
      } catch (e) {
        showStatus('Search failed');
        console.error(e);
      }
    }
    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // Notes (localStorage keyed by rough place + year)
    function notesKey() {
      const c = map.getCenter();
      return `cm-notes-${currentYear}-${c.lng.toFixed(2)}-${c.lat.toFixed(2)}`;
    }
    function loadNotes() {
      const ta = document.getElementById('notes');
      ta.value = localStorage.getItem(notesKey()) || '';
    }
    function saveNotes() {
      localStorage.setItem(notesKey(), document.getElementById('notes').value);
    }
    document.getElementById('notes').addEventListener('input', saveNotes);
    map.on('moveend', () => { if (document.getElementById('notes') === document.activeElement) return; loadNotes(); });

    // Keyboard year change
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        applyDateFilter(currentYear - (e.shiftKey ? 10 : 1));
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        applyDateFilter(currentYear + (e.shiftKey ? 10 : 1));
      }
    });
  </script>
</body>
</html>
